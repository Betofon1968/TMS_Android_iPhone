# Render Blueprint for the driver app: a static website (no server needed).
# In Render: New > Blueprint > pick this repository. You will be asked for VITE_TMS_API_URL,
# the address of your TMS server, for example https://tms-truck.onrender.com
services:
  - type: web
    name: tms-driver
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_TMS_API_URL
        sync: false
      - key: NODE_VERSION
        value: "22"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: same-origin
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
